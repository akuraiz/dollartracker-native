<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DollarTracker Native</title>
  <style>
    :root{
      color-scheme:dark light;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#090b12;
      color:#f8fafc;
    }
    body{
      min-height:100svh;
      margin:0;
      display:grid;
      place-items:center;
      padding:24px;
      text-align:center;
      background:radial-gradient(circle at top,#233056,transparent 44%),#090b12;
    }
    main{
      max-width:440px;
      padding:28px;
      border-radius:28px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.14);
      box-shadow:0 24px 80px rgba(0,0,0,.30);
    }
    h1{margin:0 0 10px;font-size:24px}
    p{margin:0 0 18px;color:#cbd5e1;line-height:1.5}
    code{background:rgba(255,255,255,.10);padding:2px 6px;border-radius:8px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:999px;background:#fff;color:#111827;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main>
    <h1>DollarTracker Native</h1>
    <p>This rollback keeps the app inside the <code>www</code> folder. Open the app from <code>/www/</code>.</p>
    <a href="./www/">Open DollarTracker</a>
  </main>
</body>
</html>
